<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Números del 1 al 20</title>
<style>
  :root{ --bg-deep:#05060f; --bg-mid:#0d1224; --card-bd: rgba(255,255,255,0.08); }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: 'Trebuchet MS', sans-serif; color: #f0f2ff;
  }

  header{ text-align: center; padding: 40px 20px 20px; }
  h1{
    margin: 0 0 6px 0; font-size: clamp(1.6rem, 5vw, 2.4rem);
    background: linear-gradient(135deg, #7ee8fa, #a78bfa, #ffd97a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p{ color: #b7bde0; margin: 0; font-size: .95rem; }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
    gap: 12px; max-width: 900px; margin: 30px auto 60px; padding: 0 20px;
  }

  .card{
    position: relative; aspect-ratio: 1 / 1; border-radius: 16px;
    border: 1px solid var(--card-bd);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; font-weight: bold; cursor: pointer; user-select: none;
    transition: transform 0.25s ease, box-shadow 0.25s ease; color: white;
  }
  .card:hover{ transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
  .card.grow{ transform: scale(1.3); z-index: 5; box-shadow: 0 18px 40px rgba(0,0,0,0.5); }

  .overlay{
    position: fixed; inset: 0; background: rgba(2, 4, 12, 0.75); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .overlay.show{ display: flex; }

  .modal{
    background: linear-gradient(160deg, #131a33, #0b0e1c);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 26px;
    padding: 36px 30px; text-align: center; max-width: 340px; width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55); animation: pop .3s ease; position: relative;
  }
  @keyframes pop{ 0%{ transform: scale(0.7); opacity: 0; } 100%{ transform: scale(1); opacity: 1; } }

  .modal .big-number{ font-size: 4rem; font-weight: bold; line-height: 1; margin-bottom: 14px; }

  .dots{
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    max-width: 260px; margin: 0 auto 12px;
  }
  .dots span{
    width: 16px; height: 16px; border-radius: 50%;
    display: inline-block;
  }

  .modal .close-btn{
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    color: #b7bde0; font-size: 1.3rem; cursor: pointer;
  }
  .modal .close-btn:hover{ color: white; }
</style>
</head>
<body>

<header>
  <h1>Números del 1 al 20</h1>
  <p>Toca un número para ver esa cantidad de puntitos</p>
</header>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="big-number" id="modalNumber"></div>
    <div class="dots" id="modalDots"></div>
  </div>
</div>

<script>
  const grid = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const modalNumber = document.getElementById('modalNumber');
  const modalDots = document.getElementById('modalDots');

  let activeCard = null;

  const palette = [
    ['#ff5c93', '#d6336c'], ['#5aa8ff', '#2f6fd1'], ['#7ee8fa', '#1fa7c9'],
    ['#ffd97a', '#e0a33c'], ['#a78bfa', '#7c4dff'], ['#7ed957', '#2fae4e'],
    ['#ff9a3c', '#e0672a']
  ];

  for (let n = 1; n <= 20; n++){
    const card = document.createElement('div');
    card.className = 'card';
    const colors = palette[(n - 1) % palette.length];
    card.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
    card.textContent = n;
    card.addEventListener('click', () => openCard(card, n, colors));
    grid.appendChild(card);
  }

  function openCard(card, n, colors){
    activeCard = card;
    card.classList.add('grow');

    setTimeout(() => {
      modalNumber.textContent = n;
      modalDots.innerHTML = '';
      for (let i = 0; i < n; i++){
        const dot = document.createElement('span');
        dot.style.background = `linear-gradient(135deg, ${colors[0]}, ${colors[1]})`;
        modalDots.appendChild(dot);
      }
      overlay.classList.add('show');
    }, 200);
  }

  function closeModal(){
    overlay.classList.remove('show');
    if (activeCard){ activeCard.classList.remove('grow'); activeCard = null; }
  }

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

</div>

</body>
</html>
