<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cuerpo humano interactivo</title>
<style>
  :root{
    --bg-deep:#211a2e;
    --bg-mid:#2d2440;
    --panel:#372c4d;
    --accent:#ff9f6b;
    --accent2:#ffd36b;
    --skin:#e8b98a;
    --skin-dark:#c98f5e;
    --hair:#4a3324;
    --text:#f4eee6;
    --muted:#c9b8d9;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 10%, var(--bg-mid), var(--bg-deep) 75%);
    font-family: 'Trebuchet MS', sans-serif; color: var(--text);
    display: flex; flex-direction: column; align-items: center;
  }

  header{ text-align: center; padding: 40px 20px 6px; }
  h1{
    margin: 0 0 6px 0; font-size: clamp(1.5rem, 5vw, 2.2rem);
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p{ color: var(--muted); margin: 0; font-size: .9rem; }

  .mode-toggle{ display: flex; gap: 8px; margin: 18px 0 6px; }
  .mode-toggle button{
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.06);
    color: var(--text); padding: 8px 18px; border-radius: 50px; cursor: pointer;
    font-family: inherit; font-size: .85rem; font-weight: bold;
  }
  .mode-toggle button.active{ background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #2a1c12; }

  /* ---------- Vista de cuerpo ---------- */
  #bodyView{ display: flex; flex-direction: column; align-items: center; }
  .figure-wrap{ width: min(58vw, 250px); margin: 10px auto 40px; }
  svg.figure{ width: 100%; height: auto; display: block; overflow: visible; }

  .hit{
    fill: transparent;
    stroke: none;
    cursor: pointer;
  }
  .hit:hover{ fill: rgba(255,159,107,0.18); }
  .hit.active{ fill: rgba(255,159,107,0.32); }

  /* ---------- Vista de tarjetas ---------- */
  #cardView{ display: none; width: 100%; }
  #cardView.show{ display: block; }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px; max-width: 900px; margin: 20px auto 60px; padding: 0 20px;
  }

  .card{
    background: var(--panel);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 16px;
    aspect-ratio: 1 / 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; cursor: pointer; padding: 10px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }
  .card:hover{ transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
  .card.grow{ transform: scale(1.12); box-shadow: 0 16px 30px rgba(0,0,0,0.45); }
  .card .icon-box{ width: 44px; height: 44px; }
  .card .label{ font-size: .8rem; font-weight: bold; text-align: center; color: var(--text); }

  /* ---------- Modal ---------- */
  .overlay{
    position: fixed; inset: 0; background: rgba(10, 6, 18, 0.78); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .overlay.show{ display: flex; }

  .modal{
    background: linear-gradient(160deg, #3a2f52, #241a35);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 26px;
    padding: 32px 30px; text-align: center; max-width: 320px; width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55); animation: pop .3s ease; position: relative;
  }
  @keyframes pop{ 0%{ transform: scale(0.7); opacity: 0; } 100%{ transform: scale(1); opacity: 1; } }

  .modal .icon-box{ width: 64px; height: 64px; margin: 0 auto 12px; }
  .modal .name{ font-size: 1.4rem; font-weight: bold; margin: 0 0 8px; color: var(--accent2); }
  .modal .desc{ color: #e6dcf2; font-size: 0.9rem; margin: 0; line-height: 1.4; }

  .modal .close-btn{
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    color: var(--muted); font-size: 1.3rem; cursor: pointer;
  }
  .modal .close-btn:hover{ color: white; }
</style>
</head>
<body>

<header>
  <h1>Cuerpo humano interactivo</h1>
  <p>Explora el cuerpo tocando cada parte, o revisa el modo tarjetas</p>
</header>

<div class="mode-toggle">
  <button id="modeBody" class="active">Cuerpo</button>
  <button id="modeCards">Tarjetas</button>
</div>

<div id="bodyView">
  <div class="figure-wrap">
    <svg class="figure" viewBox="0 0 200 420" xmlns="http://www.w3.org/2000/svg">

      <defs>
        <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--skin)"/>
          <stop offset="100%" stop-color="var(--skin-dark)"/>
        </linearGradient>
      </defs>

      <!-- Piernas -->
      <path d="M78,258 C74,280 72,300 73,320 C74,340 76,358 79,376 L92,376 C90,358 89,340 89,320 C89,300 90,280 92,258 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <path d="M122,258 C126,280 128,300 127,320 C126,340 124,358 121,376 L108,376 C110,358 111,340 111,320 C111,300 110,280 108,258 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Rodillas -->
      <circle cx="82" cy="320" r="7" fill="var(--skin-dark)"/>
      <circle cx="118" cy="320" r="7" fill="var(--skin-dark)"/>

      <!-- Pies -->
      <path d="M70,376 Q66,392 78,394 L96,394 Q100,394 100,388 L100,376 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <path d="M130,376 Q134,392 122,394 L104,394 Q100,394 100,388 L100,376 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Cadera / torso inferior -->
      <path d="M70,225 C68,238 68,248 72,258 L128,258 C132,248 132,238 130,225 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Abdomen -->
      <path d="M74,185 C72,198 70,212 70,225 L130,225 C130,212 128,198 126,185 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Pecho / hombros -->
      <path d="M62,132 C62,118 72,110 100,110 C128,110 138,118 138,132 L134,150 C132,168 128,178 126,185 L74,185 C72,178 68,168 66,150 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Brazos -->
      <path d="M62,132 C50,140 44,152 44,168 C44,188 46,208 50,226 L64,226 C62,208 61,188 62,168 C63,155 66,143 70,133 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <path d="M138,132 C150,140 156,152 156,168 C156,188 154,208 150,226 L136,226 C138,208 139,188 138,168 C137,155 134,143 130,133 Z" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Codos -->
      <circle cx="53" cy="178" r="6.5" fill="var(--skin-dark)"/>
      <circle cx="147" cy="178" r="6.5" fill="var(--skin-dark)"/>

      <!-- Manos -->
      <ellipse cx="57" cy="234" rx="12" ry="15" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <ellipse cx="143" cy="234" rx="12" ry="15" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Cuello -->
      <rect x="90" y="98" width="20" height="18" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Cabeza -->
      <circle cx="100" cy="66" r="38" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Orejas -->
      <ellipse cx="60" cy="68" rx="7" ry="11" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>
      <ellipse cx="140" cy="68" rx="7" ry="11" fill="url(#skinGrad)" stroke="rgba(0,0,0,0.15)" stroke-width="1"/>

      <!-- Cabello -->
      <path d="M62,52 C60,28 78,14 100,14 C122,14 140,28 138,52 C130,38 116,32 100,32 C84,32 70,38 62,52 Z" fill="var(--hair)"/>

      <!-- Cejas -->
      <rect x="80" y="56" width="14" height="3.5" rx="1.5" fill="var(--hair)"/>
      <rect x="106" y="56" width="14" height="3.5" rx="1.5" fill="var(--hair)"/>

      <!-- Ojos -->
      <circle cx="87" cy="66" r="4" fill="#2a1c12"/>
      <circle cx="113" cy="66" r="4" fill="#2a1c12"/>

      <!-- Nariz -->
      <path d="M100,68 L96,80 Q100,84 104,80 Z" fill="var(--skin-dark)"/>

      <!-- Boca -->
      <path d="M87,90 Q100,97 113,90" stroke="#8a4a3c" stroke-width="3" fill="none" stroke-linecap="round"/>

      <!-- ============ ZONAS CLICABLES (invisibles, van encima) ============ -->
      <path class="hit" data-part="Pierna" d="M78,258 C74,280 72,300 73,320 C74,340 76,358 79,376 L92,376 C90,358 89,340 89,320 C89,300 90,280 92,258 Z"/>
      <path class="hit" data-part="Pierna" d="M122,258 C126,280 128,300 127,320 C126,340 124,358 121,376 L108,376 C110,358 111,340 111,320 C111,300 110,280 108,258 Z"/>

      <circle class="hit" data-part="Rodilla" cx="82" cy="320" r="10"/>
      <circle class="hit" data-part="Rodilla" cx="118" cy="320" r="10"/>

      <path class="hit" data-part="Pie" d="M66,374 Q60,394 78,398 L98,398 L98,374 Z"/>
      <path class="hit" data-part="Pie" d="M134,374 Q140,394 122,398 L102,398 L102,374 Z"/>

      <rect class="hit" data-part="Cadera" x="68" y="222" width="64" height="38" rx="10"/>
      <rect class="hit" data-part="Abdomen" x="70" y="182" width="60" height="45" rx="10"/>
      <path class="hit" data-part="Pecho" d="M64,130 C64,118 74,111 100,111 C126,111 136,118 136,130 L132,150 C130,166 127,177 125,184 L75,184 C73,177 70,166 68,150 Z"/>

      <path class="hit" data-part="Brazo" d="M60,132 C48,140 42,152 42,168 C42,188 44,208 48,228 L66,228 C64,208 63,188 64,168 C65,155 68,143 72,133 Z"/>
      <path class="hit" data-part="Brazo" d="M140,132 C152,140 158,152 158,168 C158,188 156,208 152,228 L134,228 C136,208 137,188 136,168 C135,155 132,143 128,133 Z"/>

      <circle class="hit" data-part="Codo" cx="53" cy="178" r="10"/>
      <circle class="hit" data-part="Codo" cx="147" cy="178" r="10"/>

      <ellipse class="hit" data-part="Mano" cx="57" cy="234" rx="15" ry="18"/>
      <ellipse class="hit" data-part="Mano" cx="143" cy="234" rx="15" ry="18"/>

      <rect class="hit" data-part="Cuello" x="88" y="96" width="24" height="22"/>

      <circle class="hit" data-part="Cabello" cx="100" cy="24" r="26"/>
      <circle class="hit" data-part="Cabeza" cx="100" cy="66" r="38"/>

      <ellipse class="hit" data-part="Orejas" cx="60" cy="68" rx="10" ry="14"/>
      <ellipse class="hit" data-part="Orejas" cx="140" cy="68" rx="10" ry="14"/>

      <rect class="hit" data-part="Cejas" x="78" y="52" width="44" height="10"/>
      <circle class="hit" data-part="Ojos" cx="87" cy="66" r="9"/>
      <circle class="hit" data-part="Ojos" cx="113" cy="66" r="9"/>
      <path class="hit" data-part="Nariz" d="M92,64 L108,64 L108,84 L92,84 Z"/>
      <path class="hit" data-part="Boca" d="M82,86 L118,86 L118,100 L82,100 Z"/>

    </svg>
  </div>
</div>

<div id="cardView">
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="icon-box" id="modalIcon"></div>
    <p class="name" id="modalName"></p>
    <p class="desc" id="modalDesc"></p>
  </div>
</div>

<script>
  // ---------- Iconos hechos en SVG puro (sin emojis) para cada parte ----------
  function svgWrap(inner){
    return `<svg viewBox="0 0 60 60" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${inner}</svg>`;
  }

  const icons = {
    'Cabello': svgWrap('<path d="M8,30 C6,14 20,6 30,6 C40,6 54,14 52,30 C46,20 38,16 30,16 C22,16 14,20 8,30 Z" fill="#4a3324"/>'),
    'Cabeza': svgWrap('<circle cx="30" cy="30" r="22" fill="#e8b98a"/>'),
    'Cejas': svgWrap('<rect x="10" y="26" width="16" height="4" rx="2" fill="#4a3324"/><rect x="34" y="26" width="16" height="4" rx="2" fill="#4a3324"/>'),
    'Ojos': svgWrap('<circle cx="20" cy="30" r="6" fill="#e8b98a"/><circle cx="40" cy="30" r="6" fill="#e8b98a"/><circle cx="20" cy="30" r="3" fill="#2a1c12"/><circle cx="40" cy="30" r="3" fill="#2a1c12"/>'),
    'Orejas': svgWrap('<ellipse cx="14" cy="30" rx="7" ry="11" fill="#e8b98a"/><ellipse cx="46" cy="30" rx="7" ry="11" fill="#e8b98a"/>'),
    'Nariz': svgWrap('<path d="M30,12 L22,40 Q30,48 38,40 Z" fill="#c98f5e"/>'),
    'Boca': svgWrap('<path d="M12,26 Q30,42 48,26" stroke="#8a4a3c" stroke-width="5" fill="none" stroke-linecap="round"/>'),
    'Cuello': svgWrap('<rect x="20" y="12" width="20" height="36" rx="4" fill="#e8b98a"/>'),
    'Hombro': svgWrap('<path d="M6,40 C6,20 20,12 30,12 C40,12 54,20 54,40 Z" fill="#e8b98a"/>'),
    'Pecho': svgWrap('<rect x="10" y="10" width="40" height="40" rx="14" fill="#e8b98a"/>'),
    'Abdomen': svgWrap('<rect x="14" y="14" width="32" height="32" rx="10" fill="#c98f5e"/>'),
    'Brazo': svgWrap('<path d="M22,4 C16,10 14,20 15,32 C16,40 18,48 20,56 L34,56 C32,48 30,40 30,32 C30,20 30,10 34,4 Z" fill="#e8b98a"/>'),
    'Codo': svgWrap('<circle cx="30" cy="30" r="12" fill="#c98f5e"/>'),
    'Mano': svgWrap('<ellipse cx="30" cy="32" rx="16" ry="20" fill="#e8b98a"/>'),
    'Cadera': svgWrap('<path d="M8,14 Q30,4 52,14 L48,46 L12,46 Z" fill="#e8b98a"/>'),
    'Muslo': svgWrap('<path d="M18,4 C14,20 14,36 18,56 L38,56 C42,36 42,20 38,4 Z" fill="#e8b98a"/>'),
    'Rodilla': svgWrap('<circle cx="30" cy="30" r="13" fill="#c98f5e"/>'),
    'Pantorrilla': svgWrap('<path d="M20,4 C16,20 16,38 20,56 L36,56 C40,38 40,20 36,4 Z" fill="#e8b98a"/>'),
    'Pie': svgWrap('<path d="M8,40 Q4,52 18,54 L48,54 Q52,54 52,46 L52,40 Z" fill="#e8b98a"/>')
  };

  // ---------- Descripciones ----------
  const partsData = {
    'Cabello':      'Cubre el cuero cabelludo y ayuda a proteger la piel de la cabeza del sol y el frío.',
    'Cabeza':       'Contiene el cerebro, el órgano que controla todo el cuerpo y nuestros pensamientos.',
    'Cejas':        'Ayudan a que el sudor no caiga directo a los ojos y también sirven para expresar emociones.',
    'Ojos':         'Nos permiten ver lo que nos rodea gracias a la luz que captan.',
    'Orejas':       'Nos permiten escuchar sonidos y también ayudan a mantener el equilibrio.',
    'Nariz':        'Sirve para respirar y para percibir los olores.',
    'Boca':         'Sirve para hablar, comer, respirar y expresar emociones.',
    'Cuello':       'Conecta la cabeza con el resto del cuerpo y le da movilidad para girar y asentir.',
    'Hombro':       'Une el brazo con el torso y permite un amplio rango de movimiento del brazo.',
    'Pecho':        'Protege órganos vitales como el corazón y los pulmones.',
    'Abdomen':      'Contiene órganos importantes como el estómago, el hígado y los intestinos.',
    'Brazo':        'Nos ayuda a alcanzar, cargar y sostener objetos.',
    'Codo':         'Es la articulación que permite doblar el brazo.',
    'Mano':         'Nos permite tomar cosas y hacer movimientos precisos con los dedos.',
    'Cadera':       'Une las piernas con el torso y ayuda a mantener el equilibrio al caminar.',
    'Muslo':        'Es la parte superior de la pierna; contiene algunos de los músculos más grandes del cuerpo.',
    'Rodilla':      'Es la articulación que permite doblar la pierna al caminar, correr o saltar.',
    'Pantorrilla':  'Es la parte trasera de la pierna, debajo de la rodilla; ayuda a caminar y saltar.',
    'Pie':          'Nos da equilibrio y apoyo para pararnos y caminar.'
  };

  const overlay = document.getElementById('overlay');
  const modalIcon = document.getElementById('modalIcon');
  const modalName = document.getElementById('modalName');
  const modalDesc = document.getElementById('modalDesc');

  function openInfo(name){
    modalIcon.innerHTML = icons[name] || '';
    modalName.textContent = name;
    modalDesc.textContent = partsData[name] || '';
    overlay.classList.add('show');
  }

  function closeModal(){
    overlay.classList.remove('show');
    document.querySelectorAll('.hit.active').forEach(h => h.classList.remove('active'));
    document.querySelectorAll('.card.grow').forEach(c => c.classList.remove('grow'));
  }

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  // ---------- Vista de cuerpo: zonas clicables ----------
  document.querySelectorAll('.hit').forEach(hit => {
    hit.addEventListener('click', () => {
      const name = hit.dataset.part;
      document.querySelectorAll('.hit').forEach(h => {
        h.classList.toggle('active', h.dataset.part === name);
      });
      openInfo(name);
    });
  });

  // ---------- Vista de tarjetas ----------
  const grid = document.getElementById('grid');
  Object.keys(partsData).forEach(name => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<div class="icon-box">${icons[name] || ''}</div><div class="label">${name}</div>`;
    card.addEventListener('click', () => {
      document.querySelectorAll('.card').forEach(c => c.classList.remove('grow'));
      card.classList.add('grow');
      openInfo(name);
    });
    grid.appendChild(card);
  });

  // ---------- Cambio de modo ----------
  const modeBodyBtn = document.getElementById('modeBody');
  const modeCardsBtn = document.getElementById('modeCards');
  const bodyView = document.getElementById('bodyView');
  const cardView = document.getElementById('cardView');

  modeBodyBtn.addEventListener('click', () => {
    modeBodyBtn.classList.add('active');
    modeCardsBtn.classList.remove('active');
    bodyView.style.display = 'flex';
    cardView.classList.remove('show');
  });

  modeCardsBtn.addEventListener('click', () => {
    modeCardsBtn.classList.add('active');
    modeBodyBtn.classList.remove('active');
    bodyView.style.display = 'none';
    cardView.classList.add('show');
  });
</script>


<div class="proyectos-nav" style="position:fixed;top:14px;left:14px;z-index:99999;display:flex;gap:8px;flex-wrap:wrap;">
  <a href="index.html" style="display:inline-block;padding:9px 13px;border-radius:9px;text-decoration:none;color:#fff;background:rgba(5,10,18,.88);border:1px solid rgba(22,131,255,.45);font:600 14px Arial,sans-serif;backdrop-filter:blur(8px);">← Mis proyectos</a>
  <a href="portafolio.html" style="display:inline-block;padding:9px 13px;border-radius:9px;text-decoration:none;color:#fff;background:rgba(5,10,18,.88);border:1px solid rgba(22,131,255,.45);font:600 14px Arial,sans-serif;backdrop-filter:blur(8px);">Portafolio</a>
</div>

</body>
</html>
