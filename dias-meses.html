<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Días y meses</title>
<style>
  :root{ --bg-deep:#05060f; --bg-mid:#0d1224; --card-bd: rgba(255,255,255,0.08); }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: 'Trebuchet MS', sans-serif; color: #f0f2ff;
  }

  header{ text-align: center; padding: 40px 20px 10px; }
  h1{
    margin: 0 0 6px 0; font-size: clamp(1.6rem, 5vw, 2.4rem);
    background: linear-gradient(135deg, #ffd97a, #ff8fd0, #7ee8fa);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p{ color: #b7bde0; margin: 0; font-size: .95rem; }

  h2.section{
    text-align: center; color: #cfd6ff; font-size: 1.1rem;
    margin: 30px 0 12px; letter-spacing: 1px; text-transform: uppercase; opacity: .8;
  }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
    gap: 14px; max-width: 900px; margin: 0 auto; padding: 0 20px 20px;
  }

  .card{
    position: relative; aspect-ratio: 1 / 1; border-radius: 16px;
    border: 1px solid var(--card-bd);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.05rem; font-weight: bold; text-align: center; padding: 8px;
    cursor: pointer; user-select: none; color: white;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover{ transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
  .card.grow{ transform: scale(1.25); z-index: 5; box-shadow: 0 18px 40px rgba(0,0,0,0.5); }

  .overlay{
    position: fixed; inset: 0; background: rgba(2, 4, 12, 0.75); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .overlay.show{ display: flex; }

  .modal{
    background: linear-gradient(160deg, #131a33, #0b0e1c);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 26px;
    padding: 36px 30px; text-align: center; max-width: 340px; width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55); animation: pop .3s ease; position: relative;
  }
  @keyframes pop{ 0%{ transform: scale(0.7); opacity: 0; } 100%{ transform: scale(1); opacity: 1; } }

  .modal .icon{ font-size: 2.6rem; margin-bottom: 10px; }
  .modal .name{ font-size: 1.4rem; font-weight: bold; margin: 0 0 8px; }
  .modal .desc{ color: #9aa3cc; font-size: 0.88rem; margin: 0; line-height: 1.4; }

  .modal .close-btn{
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    color: #b7bde0; font-size: 1.3rem; cursor: pointer;
  }
  .modal .close-btn:hover{ color: white; }
</style>
</head>
<body>

<header>
  <h1>Días y meses</h1>
  <p>Toca una tarjeta para ver un dato curioso</p>
</header>

<h2 class="section">Días de la semana</h2>
<div class="grid" id="dayGrid"></div>

<h2 class="section">Meses del año</h2>
<div class="grid" id="monthGrid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="icon" id="modalIcon"></div>
    <p class="name" id="modalName"></p>
    <p class="desc" id="modalDesc"></p>
  </div>
</div>

<script>
  const dayGrid = document.getElementById('dayGrid');
  const monthGrid = document.getElementById('monthGrid');
  const overlay = document.getElementById('overlay');
  const modalIcon = document.getElementById('modalIcon');
  const modalName = document.getElementById('modalName');
  const modalDesc = document.getElementById('modalDesc');

  let activeCard = null;

  const days = [
    { name: 'Lunes',     icon: '📅', desc: 'El primer día de la semana laboral, después del descanso del domingo.' },
    { name: 'Martes',    icon: '🗓️', desc: 'Su nombre viene del dios romano Marte.' },
    { name: 'Miércoles', icon: '📆', desc: 'Está justo a la mitad de la semana.' },
    { name: 'Jueves',    icon: '🗓️', desc: 'Su nombre viene del dios romano Júpiter.' },
    { name: 'Viernes',   icon: '📅', desc: 'El último día laboral para muchas personas, antes del fin de semana.' },
    { name: 'Sábado',    icon: '🌤️', desc: 'Parte del fin de semana, ideal para descansar o salir.' },
    { name: 'Domingo',   icon: '☀️', desc: 'El último día de la semana, tradicionalmente de descanso.' }
  ];

  const months = [
    { name: 'Enero',      icon: '🎉', desc: 'Primer mes del año, empieza justo después del Año Nuevo.' },
    { name: 'Febrero',    icon: '💘', desc: 'El mes más corto, tiene el Día del Amor y la Amistad.' },
    { name: 'Marzo',      icon: '🌱', desc: 'Marca el inicio de la primavera en el hemisferio norte.' },
    { name: 'Abril',      icon: '🌧️', desc: 'Suele asociarse con lluvias en varias regiones.' },
    { name: 'Mayo',       icon: '🌸', desc: 'Mes en que se celebra a las madres en muchos países.' },
    { name: 'Junio',      icon: '☀️', desc: 'Empieza el verano en el hemisferio norte.' },
    { name: 'Julio',      icon: '🏖️', desc: 'Uno de los meses más calurosos del año.' },
    { name: 'Agosto',     icon: '🌻', desc: 'Último mes completo del verano en el hemisferio norte.' },
    { name: 'Septiembre', icon: '🎒', desc: 'En muchos países marca el regreso a clases.' },
    { name: 'Octubre',    icon: '🎃', desc: 'Mes asociado al Halloween y el otoño.' },
    { name: 'Noviembre',  icon: '🍂', desc: 'Penúltimo mes del año, con clima más fresco en el norte.' },
    { name: 'Diciembre',  icon: '🎄', desc: 'Último mes del año, con Navidad y Año Nuevo.' }
  ];

  const dayColors = ['#ff5c93', '#5aa8ff', '#7ee8fa', '#ffd97a', '#a78bfa', '#7ed957', '#ff9a3c'];
  const monthColors = [
    '#ff5c93','#5aa8ff','#7ee8fa','#ffd97a','#a78bfa','#7ed957',
    '#ff9a3c','#f472b6','#4caf50','#e0672a','#8e5cd9','#2f6fd1'
  ];

  function buildCards(list, container, colors){
    list.forEach((item, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.style.background = colors[i % colors.length];
      card.textContent = item.name;
      card.addEventListener('click', () => openCard(card, item));
      container.appendChild(card);
    });
  }

  buildCards(days, dayGrid, dayColors);
  buildCards(months, monthGrid, monthColors);

  function openCard(card, item){
    activeCard = card;
    card.classList.add('grow');
    setTimeout(() => {
      modalIcon.textContent = item.icon;
      modalName.textContent = item.name;
      modalDesc.textContent = item.desc;
      overlay.classList.add('show');
    }, 200);
  }

  function closeModal(){
    overlay.classList.remove('show');
    if (activeCard){ activeCard.classList.remove('grow'); activeCard = null; }
  }

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

</div>

</body>
</html>
