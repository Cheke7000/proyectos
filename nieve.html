<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nieve nocturna</title>
<style>
  :root{ --sky1:#050814; --sky2:#0d1830; --sky3:#182a4d; }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(180deg, var(--sky1), var(--sky2) 55%, var(--sky3));
    font-family: 'Trebuchet MS', sans-serif;
  }
  canvas{ display: block; }

  .title{
    position: fixed; top: 20px; left: 0; right: 0; text-align: center;
    color: #eaf2ff; letter-spacing: 3px; font-size: 1.2rem; text-transform: uppercase;
    opacity: .85; z-index: 5; pointer-events: none;
  }

  .panel{
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 16px; padding: 10px 18px; display: flex; gap: 16px; align-items: center;
    color: #dbe4ff; font-size: .8rem; backdrop-filter: blur(4px); z-index: 5;
  }
  .panel label{ display: flex; align-items: center; gap: 6px; }
  .panel input[type="range"]{ width: 90px; }
</style>
</head>
<body>

<div class="title">Nieve nocturna</div>

<canvas id="canvas"></canvas>

<div class="panel">
  <label>Viento
    <input type="range" id="wind" min="-2" max="2" step="0.1" value="0.3">
  </label>
  <label>Cantidad
    <input type="range" id="amount" min="40" max="300" step="10" value="140">
  </label>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const windSlider = document.getElementById('wind');
  const amountSlider = document.getElementById('amount');

  let W, H;
  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function makeFlake(){
    return {
      x: Math.random() * W,
      y: Math.random() * -H,
      r: 1 + Math.random() * 3,
      speed: 0.6 + Math.random() * 1.6,
      sway: Math.random() * Math.PI * 2,
      swaySpeed: 0.01 + Math.random() * 0.02,
      opacity: 0.4 + Math.random() * 0.6
    };
  }

  let flakes = [];
  function rebuildFlakes(){
    const count = parseInt(amountSlider.value, 10);
    flakes = Array.from({ length: count }, makeFlake);
  }
  rebuildFlakes();
  amountSlider.addEventListener('input', rebuildFlakes);

  // Genera una silueta de ciudad fija (no cambia entre frames) usando semillas
  const buildingHeights = Array.from({ length: 16 }, (_, i) => 50 + ((i * 37) % 90));

  // Genera un patrón fijo de ventanas encendidas/apagadas por edificio
  const buildingWindows = buildingHeights.map(h => {
    const rows = Math.floor(h / 14);
    const cols = 3;
    const pattern = [];
    for (let r = 0; r < rows; r++){
      for (let c = 0; c < cols; c++){
        pattern.push(Math.random() < 0.55); // true = ventana encendida
      }
    }
    return { rows, cols, pattern };
  });

  function drawFixedSkyline(){
    const w = W / buildingHeights.length;

    buildingHeights.forEach((h, i) => {
      const x = i * w;
      const y = H - h;

      // cuerpo del edificio
      ctx.fillStyle = 'rgba(4, 7, 18, 0.95)';
      ctx.fillRect(x, y, w - 2, h);

      // ventanas
      const { rows, cols, pattern } = buildingWindows[i];
      const winW = (w - 2) / (cols * 1.8);
      const winH = 6;
      const gapX = ((w - 2) - cols * winW) / (cols + 1);
      const gapY = (h - rows * winH) / (rows + 1);

      pattern.forEach((lit, idx) => {
        const r = Math.floor(idx / cols);
        const c = idx % cols;
        const wx = x + gapX + c * (winW + gapX);
        const wy = y + gapY + r * (winH + gapY);
        ctx.fillStyle = lit ? 'rgba(255, 221, 140, 0.85)' : 'rgba(255, 255, 255, 0.06)';
        ctx.fillRect(wx, wy, winW, winH);
      });
    });
  }

  function animate(){
    ctx.clearRect(0, 0, W, H);

    const wind = parseFloat(windSlider.value);

    ctx.save();
    flakes.forEach(f => {
      f.y += f.speed;
      f.sway += f.swaySpeed;
      f.x += Math.sin(f.sway) * 0.6 + wind * 0.5;

      if (f.y > H + 10){
        f.y = -10;
        f.x = Math.random() * W;
      }
      if (f.x > W + 10) f.x = -10;
      if (f.x < -10) f.x = W + 10;

      ctx.beginPath();
      ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${f.opacity})`;
      ctx.fill();
    });
    ctx.restore();

    drawFixedSkyline();

    requestAnimationFrame(animate);
  }

  animate();
</script>

</div>

</body>
</html>
