<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colores y formas</title>
<style>
  :root{ --bg-deep:#05060f; --bg-mid:#0d1224; --card-bd: rgba(255,255,255,0.08); }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; min-height: 100%;
    background: radial-gradient(ellipse at 50% 20%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: 'Trebuchet MS', sans-serif; color: #f0f2ff;
  }

  header{ text-align: center; padding: 40px 20px 10px; }
  h1{
    margin: 0 0 6px 0; font-size: clamp(1.6rem, 5vw, 2.4rem);
    background: linear-gradient(135deg, #ff8fd0, #7ee8fa, #ffd97a);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  header p{ color: #b7bde0; margin: 0; font-size: .95rem; }

  h2.section{
    text-align: center; color: #cfd6ff; font-size: 1.1rem;
    margin: 30px 0 12px; letter-spacing: 1px; text-transform: uppercase; opacity: .8;
  }

  .grid{
    display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
    gap: 14px; max-width: 900px; margin: 0 auto; padding: 0 20px 20px;
  }

  .card{
    position: relative; aspect-ratio: 1 / 1; border-radius: 16px;
    border: 1px solid var(--card-bd);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; user-select: none;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
  }
  .card:hover{ transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.35); }
  .card.grow{ transform: scale(1.3); z-index: 5; box-shadow: 0 18px 40px rgba(0,0,0,0.5); }

  .card .shape-icon{ width: 46%; height: 46%; }

  .overlay{
    position: fixed; inset: 0; background: rgba(2, 4, 12, 0.75); backdrop-filter: blur(3px);
    display: none; align-items: center; justify-content: center; z-index: 30; padding: 20px;
  }
  .overlay.show{ display: flex; }

  .modal{
    background: linear-gradient(160deg, #131a33, #0b0e1c);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 26px;
    padding: 36px 30px; text-align: center; max-width: 320px; width: 100%;
    box-shadow: 0 25px 60px rgba(0,0,0,0.55); animation: pop .3s ease; position: relative;
  }
  @keyframes pop{ 0%{ transform: scale(0.7); opacity: 0; } 100%{ transform: scale(1); opacity: 1; } }

  .modal .preview{ width: 90px; height: 90px; margin: 0 auto 16px; display:flex; align-items:center; justify-content:center; }
  .modal .name{ font-size: 1.4rem; font-weight: bold; margin: 0 0 6px; }
  .modal .desc{ color: #9aa3cc; font-size: 0.85rem; margin: 0; }

  .modal .close-btn{
    position: absolute; top: 12px; right: 16px; background: none; border: none;
    color: #b7bde0; font-size: 1.3rem; cursor: pointer;
  }
  .modal .close-btn:hover{ color: white; }
</style>
</head>
<body>

<header>
  <h1>Colores y formas</h1>
  <p>Toca una tarjeta para ver su nombre</p>
</header>

<h2 class="section">Colores</h2>
<div class="grid" id="colorGrid"></div>

<h2 class="section">Formas</h2>
<div class="grid" id="shapeGrid"></div>

<div class="overlay" id="overlay">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="preview" id="modalPreview"></div>
    <p class="name" id="modalName"></p>
    <p class="desc" id="modalDesc"></p>
  </div>
</div>

<script>
  const colorGrid = document.getElementById('colorGrid');
  const shapeGrid = document.getElementById('shapeGrid');
  const overlay = document.getElementById('overlay');
  const modalPreview = document.getElementById('modalPreview');
  const modalName = document.getElementById('modalName');
  const modalDesc = document.getElementById('modalDesc');

  let activeCard = null;

  const colors = [
    { name: 'Rojo',     hex: '#e63946', desc: 'Como una fresa o un corazón.' },
    { name: 'Azul',     hex: '#457bd8', desc: 'Como el cielo despejado.' },
    { name: 'Amarillo', hex: '#f4c542', desc: 'Como el sol o un plátano.' },
    { name: 'Verde',    hex: '#4caf50', desc: 'Como las hojas de un árbol.' },
    { name: 'Naranja',  hex: '#f2843a', desc: 'Como una naranja o una zanahoria.' },
    { name: 'Morado',   hex: '#8e5cd9', desc: 'Como una uva madura.' },
    { name: 'Rosado',   hex: '#f472b6', desc: 'Como un algodón de azúcar.' },
    { name: 'Café',     hex: '#8b5e3c', desc: 'Como la tierra o el chocolate.' },
    { name: 'Negro',    hex: '#2b2b2b', desc: 'El color más oscuro de todos.' },
    { name: 'Blanco',   hex: '#f4f4f4', desc: 'Como la nieve o una nube.' },
    { name: 'Gris',     hex: '#9aa0a6', desc: 'Como una piedra o el cemento.' },
    { name: 'Celeste',  hex: '#7ee8fa', desc: 'Como el mar poco profundo.' }
  ];

  const shapes = [
    { name: 'Círculo',    desc: 'No tiene lados ni esquinas, es totalmente redondo.' },
    { name: 'Cuadrado',   desc: 'Tiene 4 lados iguales y 4 esquinas.' },
    { name: 'Triángulo',  desc: 'Tiene 3 lados y 3 esquinas.' },
    { name: 'Rectángulo', desc: 'Tiene 4 lados, dos más largos que los otros dos.' },
    { name: 'Óvalo',      desc: 'Es como un círculo, pero alargado.' },
    { name: 'Rombo',      desc: 'Tiene 4 lados iguales, pero inclinados.' },
    { name: 'Estrella',   desc: 'Tiene varias puntas, normalmente 5.' },
    { name: 'Corazón',    desc: 'Forma que suele representar el cariño.' },
    { name: 'Pentágono',  desc: 'Tiene 5 lados y 5 esquinas.' },
    { name: 'Hexágono',   desc: 'Tiene 6 lados y 6 esquinas, como un panal de abejas.' }
  ];

  function makeShapeSVG(name, fill){
    const svgs = {
      'Círculo': `<circle cx="50" cy="50" r="42" fill="${fill}"/>`,
      'Cuadrado': `<rect x="10" y="10" width="80" height="80" fill="${fill}"/>`,
      'Triángulo': `<polygon points="50,8 92,88 8,88" fill="${fill}"/>`,
      'Rectángulo': `<rect x="6" y="24" width="88" height="52" fill="${fill}"/>`,
      'Óvalo': `<ellipse cx="50" cy="50" rx="46" ry="30" fill="${fill}"/>`,
      'Rombo': `<polygon points="50,6 94,50 50,94 6,50" fill="${fill}"/>`,
      'Estrella': `<polygon points="50,4 61,37 96,37 68,58 78,92 50,71 22,92 32,58 4,37 39,37" fill="${fill}"/>`,
      'Corazón': `<path d="M50 88 C20 65 4 45 4 27 C4 12 16 4 28 4 C38 4 46 10 50 20 C54 10 62 4 72 4 C84 4 96 12 96 27 C96 45 80 65 50 88 Z" fill="${fill}"/>`,
      'Pentágono': `<polygon points="50,4 94,36 78,90 22,90 6,36" fill="${fill}"/>`,
      'Hexágono': `<polygon points="27,6 73,6 96,50 73,94 27,94 4,50" fill="${fill}"/>`
    };
    return `<svg class="shape-icon" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">${svgs[name]}</svg>`;
  }

  const shapeFills = ['#7ee8fa', '#ff8fd0', '#ffd97a', '#a78bfa', '#7ed957', '#ff9a3c', '#5aa8ff', '#ff5c93', '#4caf50', '#f4c542'];

  colors.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.background = item.hex;
    card.addEventListener('click', () => openColorCard(card, item));
    colorGrid.appendChild(card);
  });

  shapes.forEach((item, i) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.style.background = 'rgba(255,255,255,0.06)';
    card.innerHTML = makeShapeSVG(item.name, shapeFills[i % shapeFills.length]);
    card.addEventListener('click', () => openShapeCard(card, item, shapeFills[i % shapeFills.length]));
    shapeGrid.appendChild(card);
  });

  function openColorCard(card, item){
    activeCard = card;
    card.classList.add('grow');
    setTimeout(() => {
      modalPreview.innerHTML = `<div style="width:100%;height:100%;border-radius:50%;background:${item.hex};"></div>`;
      modalName.textContent = item.name;
      modalDesc.textContent = item.desc;
      overlay.classList.add('show');
    }, 200);
  }

  function openShapeCard(card, item, fill){
    activeCard = card;
    card.classList.add('grow');
    setTimeout(() => {
      modalPreview.innerHTML = makeShapeSVG(item.name, fill).replace('class="shape-icon"', 'style="width:100%;height:100%;"');
      modalName.textContent = item.name;
      modalDesc.textContent = item.desc;
      overlay.classList.add('show');
    }, 200);
  }

  function closeModal(){
    overlay.classList.remove('show');
    if (activeCard){ activeCard.classList.remove('grow'); activeCard = null; }
  }

  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
</script>

<nav class="project-nav"><a href="../proyectos.html">← Mis proyectos</a><a href="../index.html">Portafolio</a></nav></body>
</html>
