<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Snake</title>
<style>
  :root{ --g1:#0a1f14; --g2:#123a24; --g3:#1f6b3a; --gd:#7ee87e; }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0; height: 100%; overflow: hidden;
    background: linear-gradient(160deg, var(--g1), var(--g2));
    font-family: 'Trebuchet MS', sans-serif;
    display: flex; flex-direction: column; align-items: center;
    touch-action: none;
  }

  h1{ color: var(--gd); margin: 50px 0 4px 0; text-align: center; font-size: 1.4rem; }
  .hud{ color: #bdf5c8; font-weight: bold; margin-bottom: 8px; font-size: .95rem; }

  #boardWrap{
    position: relative;
    width: min(92vw, 420px);
    aspect-ratio: 1 / 1;
    background: #0d2818;
    border-radius: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  canvas{ width: 100%; height: 100%; display: block; }

  .overlay{
    position: absolute; inset: 0; background: rgba(5, 15, 10, 0.88);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 20px; color: #eafff0;
  }
  .overlay.show{ display: flex; }
  .overlay h2{ color: var(--gd); margin-bottom: 6px; }
  button{
    border: none; border-radius: 50px; padding: 10px 24px; margin-top: 12px;
    background: linear-gradient(135deg, var(--g3), #0f8a3f);
    color: white; font-weight: bold; cursor: pointer; font-family: inherit;
  }

  .controls{
    display: grid;
    grid-template-columns: 56px 56px 56px;
    grid-template-rows: 56px 56px 56px;
    gap: 8px;
    margin: 18px 0 24px;
  }
  .controls button{
    margin: 0; width: 56px; height: 56px; border-radius: 14px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);
    color: #eafff0; font-size: 1.4rem; display: flex; align-items: center; justify-content: center;
  }
  .controls button:active{ background: rgba(255,255,255,0.2); }
  .c-up{ grid-column: 2; grid-row: 1; }
  .c-left{ grid-column: 1; grid-row: 2; }
  .c-down{ grid-column: 2; grid-row: 2; }
  .c-right{ grid-column: 3; grid-row: 2; }
</style>
</head>
<body>

<h1>Snake</h1>
<p class="hud">Puntos: <span id="score">0</span></p>

<div id="boardWrap">
  <canvas id="canvas" width="400" height="400"></canvas>
  <div class="overlay" id="startOverlay">
    <h2>¿Listo para jugar?</h2>
    <p>Usa las flechas/WASD en PC, o los botones/deslizar en móvil.</p>
    <button onclick="startGame()">Empezar</button>
  </div>
  <div class="overlay" id="endOverlay">
    <h2>¡Chocaste!</h2>
    <p id="endScore"></p>
    <button onclick="startGame()">Jugar de nuevo</button>
  </div>
</div>

<div class="controls">
  <button class="c-up" data-dir="up">▲</button>
  <button class="c-left" data-dir="left">◀</button>
  <button class="c-down" data-dir="down">▼</button>
  <button class="c-right" data-dir="right">▶</button>
</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const startOverlay = document.getElementById('startOverlay');
  const endOverlay = document.getElementById('endOverlay');
  const endScore = document.getElementById('endScore');

  const GRID = 20;
  const CELL = canvas.width / GRID;

  let snake, dir, nextDir, food, score, running, loopId, speed;

  function resetState(){
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = 'right';
    nextDir = 'right';
    score = 0;
    speed = 140;
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood(){
    let pos;
    do {
      pos = { x: Math.floor(Math.random() * GRID), y: Math.floor(Math.random() * GRID) };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    food = pos;
  }

  function draw(){
    ctx.fillStyle = '#0d2818';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // comida
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL/2, food.y * CELL + CELL/2, CELL/2.4, 0, Math.PI*2);
    ctx.fill();

    // serpiente
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7ee87e' : '#3fae5c';
      ctx.fillRect(seg.x * CELL + 1, seg.y * CELL + 1, CELL - 2, CELL - 2);
    });
  }

  function step(){
    dir = nextDir;
    const head = { ...snake[0] };

    if (dir === 'up') head.y--;
    if (dir === 'down') head.y++;
    if (dir === 'left') head.x--;
    if (dir === 'right') head.x++;

    // colisión con pared
    if (head.x < 0 || head.x >= GRID || head.y < 0 || head.y >= GRID){
      return endGame();
    }
    // colisión consigo misma
    if (snake.some(s => s.x === head.x && s.y === head.y)){
      return endGame();
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y){
      score++;
      scoreEl.textContent = score;
      placeFood();
      if (speed > 60) speed -= 3;
      restartLoop();
    } else {
      snake.pop();
    }

    draw();
  }

  function restartLoop(){
    clearInterval(loopId);
    loopId = setInterval(step, speed);
  }

  function startGame(){
    startOverlay.classList.remove('show');
    endOverlay.classList.remove('show');
    resetState();
    draw();
    running = true;
    restartLoop();
  }

  function endGame(){
    running = false;
    clearInterval(loopId);
    endScore.textContent = `Puntuación: ${score}`;
    endOverlay.classList.add('show');
  }

  function changeDir(newDir){
    const opposite = { up: 'down', down: 'up', left: 'right', right: 'left' };
    if (!running) return;
    if (opposite[newDir] === dir) return; // no permitir giro de 180°
    nextDir = newDir;
  }

  // Teclado
  window.addEventListener('keydown', e => {
    const map = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };
    if (map[e.key]){
      changeDir(map[e.key]);
      e.preventDefault();
    }
  });

  // Botones en pantalla
  document.querySelectorAll('.controls button').forEach(btn => {
    btn.addEventListener('click', () => changeDir(btn.dataset.dir));
  });

  // Swipe táctil sobre el tablero
  let touchStartX = 0, touchStartY = 0;
  canvas.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return; // muy corto, ignorar

    if (Math.abs(dx) > Math.abs(dy)){
      changeDir(dx > 0 ? 'right' : 'left');
    } else {
      changeDir(dy > 0 ? 'down' : 'up');
    }
  }, { passive: true });

  resetState();
  draw();
  startOverlay.classList.add('show');
</script>

</body>
</html>
