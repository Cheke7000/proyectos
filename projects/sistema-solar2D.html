<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema Solar</title>
<style>
  :root{
    --bg-deep: #05010f;
    --bg-mid: #0b0426;
    --glow: #ffd97a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, var(--bg-mid), var(--bg-deep) 70%);
    font-family: 'Trebuchet MS', sans-serif;
  }

  .stars, .stars2, .stars3{
    position: fixed;
    inset: 0;
    background: transparent;
  }

  .stars{ animation: twinkle 4s ease-in-out infinite alternate; }
  .stars2{ animation: twinkle 6s ease-in-out infinite alternate-reverse; }
  .stars3{ animation: twinkle 8s ease-in-out infinite alternate; }

  @keyframes twinkle{
    0%   { opacity: 0.5; }
    50%  { opacity: 1; }
    100% { opacity: 0.6; }
  }

  .title{
    position: fixed;
    top: 24px;
    left: 0;
    right: 0;
    text-align: center;
    color: #f4f0ff;
    letter-spacing: 3px;
    font-size: 1.4rem;
    text-transform: uppercase;
    opacity: 0.85;
    z-index: 5;
  }

  .solar-system{
    position: fixed;
    top: 50%;
    left: 50%;
    width: 0;
    height: 0;
  }

  .sun{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 70px;
    height: 70px;
    margin: -35px 0 0 -35px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff6d8, #ffd45e 45%, #ff9a3c 80%);
    box-shadow:
      0 0 30px 10px rgba(255, 200, 90, 0.7),
      0 0 80px 30px rgba(255, 150, 60, 0.35),
      0 0 140px 60px rgba(255, 120, 40, 0.15);
    z-index: 2;
  }

  .orbit{
    position: absolute;
    top: 50%;
    left: 50%;
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .planet{
    position: absolute;
    top: 0;
    left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .planet::after{
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.55), rgba(255,255,255,0) 55%);
  }

  /* Mercurio */
  .orbit.o1{ width: 110px; height: 110px; animation-name: spin; animation-duration: 4s; }
  .planet.p1{ width: 8px; height: 8px; background: #b8b0a8; box-shadow: 0 0 6px 1px rgba(184,176,168,0.6); }

  /* Venus */
  .orbit.o2{ width: 160px; height: 160px; animation-name: spin; animation-duration: 7s; }
  .planet.p2{ width: 13px; height: 13px; background: #e8c27a; box-shadow: 0 0 8px 2px rgba(232,194,122,0.6); }

  /* Tierra */
  .orbit.o3{ width: 220px; height: 220px; animation-name: spin; animation-duration: 10s; }
  .planet.p3{ width: 15px; height: 15px; background: radial-gradient(circle at 40% 40%, #6ec6ff, #2c6fd1 70%); box-shadow: 0 0 10px 2px rgba(80,150,255,0.6); }

  /* Marte */
  .orbit.o4{ width: 280px; height: 280px; animation-name: spin; animation-duration: 14s; }
  .planet.p4{ width: 11px; height: 11px; background: #d1583a; box-shadow: 0 0 8px 2px rgba(209,88,58,0.6); }

  /* Jupiter */
  .orbit.o5{ width: 360px; height: 360px; animation-name: spin; animation-duration: 22s; }
  .planet.p5{ width: 28px; height: 28px; background: radial-gradient(circle at 35% 35%, #f3d9b1, #c98a4b 70%); box-shadow: 0 0 12px 3px rgba(230,180,120,0.5); }

  /* Saturno */
  .orbit.o6{ width: 440px; height: 440px; animation-name: spin; animation-duration: 30s; }
  .planet.p6{ width: 22px; height: 22px; background: radial-gradient(circle at 35% 35%, #f7ecd1, #d8b478 70%); box-shadow: 0 0 10px 2px rgba(216,180,120,0.5); }
  .planet.p6 .ring{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 46px;
    height: 46px;
    margin: -23px 0 0 -23px;
    border: 3px solid rgba(230, 210, 170, 0.55);
    border-radius: 50%;
    transform: rotateX(75deg);
  }

  /* Urano */
  .orbit.o7{ width: 520px; height: 520px; animation-name: spin; animation-duration: 40s; }
  .planet.p7{ width: 18px; height: 18px; background: radial-gradient(circle at 35% 35%, #cdfaf5, #7fd6d0 70%); box-shadow: 0 0 10px 2px rgba(150,220,215,0.5); }

  @keyframes spin{
    from{ transform: translate(-50%, -50%) rotate(0deg); }
    to  { transform: translate(-50%, -50%) rotate(360deg); }
  }

  @keyframes spinReverse{
    from{ transform: translate(-50%, -50%) rotate(360deg); }
    to  { transform: translate(-50%, -50%) rotate(0deg); }
  }

  /* ---------- Lunas ---------- */
  /* Cada luna vive dentro de su planeta, así su órbita no se ve afectada por la órbita del planeta alrededor del sol */
  .moon-orbit{
    position: absolute;
    top: 50%;
    left: 50%;
    border-radius: 50%;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }

  .moon{
    position: absolute;
    top: 0;
    left: 50%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    background: #d8d3c9;
  }

  /* Luna de la Tierra */
  .moon-orbit.mo3{ width: 26px; height: 26px; animation-name: spin; animation-duration: 3s; }
  .moon.m3{ width: 4px; height: 4px; box-shadow: 0 0 4px 1px rgba(216,211,201,0.7); }

  /* Lunas de Marte (Fobos y Deimos) */
  .moon-orbit.mo4a{ width: 18px; height: 18px; animation-name: spin; animation-duration: 1.6s; }
  .moon.m4a{ width: 2.5px; height: 2.5px; background: #b7ada2; }
  .moon-orbit.mo4b{ width: 25px; height: 25px; animation-name: spinReverse; animation-duration: 2.6s; }
  .moon.m4b{ width: 2px; height: 2px; background: #a89f95; }

  /* Lunas de Júpiter (estilo galileanas) */
  .moon-orbit.mo5a{ width: 40px; height: 40px; animation-name: spin; animation-duration: 3.2s; }
  .moon.m5a{ width: 4px; height: 4px; background: #e4dcc4; }
  .moon-orbit.mo5b{ width: 48px; height: 48px; animation-name: spin; animation-duration: 4.4s; }
  .moon.m5b{ width: 3.6px; height: 3.6px; background: #cfd8dd; }
  .moon-orbit.mo5c{ width: 56px; height: 56px; animation-name: spinReverse; animation-duration: 5.6s; }
  .moon.m5c{ width: 5px; height: 5px; background: #b7ac93; }
  .moon-orbit.mo5d{ width: 64px; height: 64px; animation-name: spin; animation-duration: 7s; }
  .moon.m5d{ width: 4.6px; height: 4.6px; background: #9d9483; }

  /* Luna de Saturno (tipo Titán), fuera del anillo */
  .moon-orbit.mo6{ width: 66px; height: 66px; animation-name: spin; animation-duration: 5.4s; }
  .moon.m6{ width: 5px; height: 5px; background: #d8c9a3; box-shadow: 0 0 4px 1px rgba(216,201,163,0.6); }

  /* Luna de Urano */
  .moon-orbit.mo7{ width: 30px; height: 30px; animation-name: spinReverse; animation-duration: 4s; }
  .moon.m7{ width: 3px; height: 3px; background: #b8c9d9; }

  /* ---------- Cinturón de asteroides (entre Marte y Júpiter) ---------- */
  .asteroid-belt{
    position: absolute;
    top: 50%;
    left: 50%;
    width: 1px;
    height: 1px;
    border-radius: 50%;
    animation-name: spin;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
    animation-duration: 140s;
  }

  .nav-link {
    position: fixed;
    z-index: 10;
    color: #f4f0ff;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.2);
    padding: 8px 16px;
    border-radius: 50px;
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: bold;
    backdrop-filter: blur(4px);
    transition: background 0.2s ease;
  }

  .nav-link:hover {
    background: rgba(255,255,255,0.18);
  }

  .back-link { top: 16px; left: 16px; }
  .next-link { top: 16px; right: 16px; }

  @media (max-width: 700px){
    .orbit.o5{ width: 300px; height: 300px; }
    .orbit.o6{ width: 360px; height: 360px; }
    .orbit.o7{ width: 420px; height: 420px; }
  }
</style>
</head>

<div class="title">Sistema Solar</div>

<div class="stars" id="stars1"></div>
<div class="stars2" id="stars2"></div>
<div class="stars3" id="stars3"></div>

<div class="solar-system">
  <div class="sun"></div>

  <div class="orbit o1"><div class="planet p1"></div></div>
  <div class="orbit o2"><div class="planet p2"></div></div>

  <div class="orbit o3">
    <div class="planet p3">
      <div class="moon-orbit mo3"><div class="moon m3"></div></div>
    </div>
  </div>

  <div class="orbit o4">
    <div class="planet p4">
      <div class="moon-orbit mo4a"><div class="moon m4a"></div></div>
      <div class="moon-orbit mo4b"><div class="moon m4b"></div></div>
    </div>
  </div>

  <div class="asteroid-belt" id="asteroidBelt"></div>

  <div class="orbit o5">
    <div class="planet p5">
      <div class="moon-orbit mo5a"><div class="moon m5a"></div></div>
      <div class="moon-orbit mo5b"><div class="moon m5b"></div></div>
      <div class="moon-orbit mo5c"><div class="moon m5c"></div></div>
      <div class="moon-orbit mo5d"><div class="moon m5d"></div></div>
    </div>
  </div>

  <div class="orbit o6">
    <div class="planet p6">
      <div class="ring"></div>
      <div class="moon-orbit mo6"><div class="moon m6"></div></div>
    </div>
  </div>

  <div class="orbit o7">
    <div class="planet p7">
      <div class="moon-orbit mo7"><div class="moon m7"></div></div>
    </div>
  </div>
</div>

<script>
  // Genera el campo de estrellas usando box-shadow puro CSS (solo círculos, sin emojis).
  function generateStars(id, count, size, color){
    let shadows = [];
    const w = window.innerWidth * 2;
    const h = window.innerHeight * 2;
    for (let i = 0; i < count; i++){
      const x = Math.floor(Math.random() * w);
      const y = Math.floor(Math.random() * h);
      shadows.push(`${x}px ${y}px ${color}`);
    }
    const el = document.getElementById(id);
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.borderRadius = '50%';
    el.style.boxShadow = shadows.join(',');
  }

  generateStars('stars1', 250, 1, '#ffffff');
  generateStars('stars2', 130, 2, '#dcd3ff');
  generateStars('stars3', 70, 3, '#ffe9c7');

  // Genera el cinturón de asteroides: puntitos dispersos en un anillo entre la órbita
  // de Marte (radio 140px) y la de Júpiter (radio 180px), también con box-shadow puro CSS.
  function generateAsteroidBelt(id, count, innerR, outerR, size, color){
    let shadows = [];
    for (let i = 0; i < count; i++){
      const angle = Math.random() * Math.PI * 2;
      const radius = innerR + Math.random() * (outerR - innerR);
      const x = Math.round(Math.cos(angle) * radius);
      const y = Math.round(Math.sin(angle) * radius);
      shadows.push(`${x}px ${y}px ${color}`);
    }
    const el = document.getElementById(id);
    el.style.boxShadow = shadows.join(',');
  }

  generateAsteroidBelt('asteroidBelt', 160, 148, 172, 1, 'rgba(190,180,165,0.85)');
</script>
