<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>¿Quieres ser mi novia? 💕</title>
<style>
  :root {
    --pink-1: #ffe4ec;
    --pink-2: #ffc2d9;
    --pink-3: #ff8fb3;
    --pink-4: #ff5c93;
    --pink-dark: #d6336c;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    font-family: 'Comic Sans MS', 'Trebuchet MS', sans-serif;
  }

  .bg {
    position: fixed;
    inset: -30px;
    background: linear-gradient(135deg, var(--pink-1), var(--pink-2), var(--pink-3));
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    filter: blur(18px);
    z-index: -1;
  }

  @keyframes bgMove {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .heart {
    position: fixed;
    top: -10%;
    font-size: 24px;
    opacity: 0.7;
    animation: fall linear infinite;
    pointer-events: none;
    user-select: none;
    z-index: 0;
  }

  @keyframes fall {
    to {
      transform: translateY(115vh) rotate(360deg);
    }
  }

  .container {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
  }

  .card {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 30px;
    padding: 40px 30px;
    box-shadow: 0 15px 35px rgba(214, 51, 108, 0.3);
    max-width: 500px;
    width: 100%;
    backdrop-filter: blur(4px);
    transition: transform 0.3s ease;
  }

  h1 {
    color: var(--pink-dark);
    font-size: clamp(1.6rem, 5vw, 2.4rem);
    margin: 0 0 10px 0;
  }

  .subtitle {
    color: #b3336b;
    font-size: 1rem;
    margin-bottom: 30px;
  }

  .gif-face {
    font-size: 4rem;
    margin-bottom: 10px;
    display: inline-block;
    animation: pulse 1.5s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }

  .buttons {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 20px;
    min-height: 100px;
    margin-top: 20px;
  }

  button {
    border: none;
    border-radius: 50px;
    padding: 14px 32px;
    font-size: 1.1rem;
    font-weight: bold;
    cursor: pointer;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    font-family: inherit;
  }

  #btnSi {
    background: linear-gradient(135deg, var(--pink-4), var(--pink-dark));
    color: white;
    box-shadow: 0 6px 15px rgba(214, 51, 108, 0.4);
    z-index: 2;
  }

  #btnSi:hover {
    transform: scale(1.08);
  }

  #btnNo {
    background: white;
    color: var(--pink-dark);
    border: 2px solid var(--pink-3);
    position: relative;
    z-index: 3;
    transition: transform 0.15s ease;
  }

  #btnNo.teleport {
    position: fixed;
    transition: top 0.2s ease, left 0.2s ease, transform 0.15s ease;
  }

  .final-message {
    display: none;
    animation: popIn 0.5s ease;
  }

  .final-message.show {
    display: block;
  }

  @keyframes popIn {
    0% { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .final-message h2 {
    color: var(--pink-dark);
    font-size: clamp(1.4rem, 5vw, 2rem);
  }

  .hidden {
    display: none !important;
  }

  .counter {
    margin-top: 12px;
    font-size: 0.85rem;
    color: #c9648b;
    min-height: 18px;
  }

  .confetti {
    position: fixed;
    top: -10px;
    font-size: 20px;
    z-index: 5;
    animation: confettiFall 3s linear forwards;
    pointer-events: none;
  }

  @keyframes confettiFall {
    to {
      transform: translateY(110vh) rotate(720deg);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div class="bg"></div>

<div class="container">
  <div class="card" id="mainCard">

    <div id="question">
      <div class="gif-face">🥺💗</div>
      <h1>¿Quieres ser mi novia?</h1>

      <div class="buttons">
        <button id="btnSi">Sí 💖</button>
        <button id="btnNo">No</button>
      </div>

      <p class="counter" id="counterText"></p>
    </div>

    <div class="final-message" id="finalMessage">
      <div class="gif-face">🥳💍</div>
      <h2 id="finalText">Sabía que dirías que sí 😌💕</h2>
      <p class="subtitle">Ahora es oficial... ¡te amo! 🌸</p>
    </div>

  </div>
</div>

<script>
  const btnNo = document.getElementById('btnNo');
  const btnSi = document.getElementById('btnSi');
  const question = document.getElementById('question');
  const finalMessage = document.getElementById('finalMessage');
  const counterText = document.getElementById('counterText');

  let noClicks = 0;

  const excuses = [
    "¡Nooo, ese botón no! 😅",
    "Casi lo agarras... casi 👀",
    "¿Otra vez? En serio? 😂",
    "El 'No' es tímido y se esconde",
    "Sigue intentando, no se va a dejar 😝",
    "Ese botón corre más rápido que tú",
    "¿Ya te cansaste? Yo no 😌",
    "El destino dice que va a ser 'Sí'",
    "Ups, se resbaló otra vez 🛼",
    "Ese botón tiene vida propia 🏃‍♂️",
    "No cuenta si no le diste 😏",
    "Mmm, tan cerca y tan lejos 🎯",
    "El 'No' está jugando a las escondidas",
    "¿Enserio vas a seguir intentando? 🤭",
    "Ese botón no quiere ser encontrado",
    "Tranquilo, el 'Sí' te espera 💗",
    "El 'No' se fue de vacaciones ✈️",
    "Nivel de dificultad: imposible 🎮",
    "Ese botón entrena parkour 🤸",
    "Ya sabes cuál es la respuesta correcta 😉"
  ];

  function moveNoButton() {
    btnNo.classList.add('teleport');

    const btnWidth = btnNo.offsetWidth;
    const btnHeight = btnNo.offsetHeight;

    const maxX = window.innerWidth - btnWidth - 20;
    const maxY = window.innerHeight - btnHeight - 20;

    const randomX = Math.max(10, Math.random() * maxX);
    const randomY = Math.max(10, Math.random() * maxY);

    btnNo.style.left = randomX + 'px';
    btnNo.style.top = randomY + 'px';

    noClicks++;
    counterText.textContent = excuses[noClicks % excuses.length];

    // El botón "Sí" crece un poco cada vez, por diversión
    const scale = Math.min(1 + noClicks * 0.08, 2.2);
    btnSi.style.transform = `scale(${scale})`;
  }

  btnNo.addEventListener('click', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  btnNo.addEventListener('touchstart', (e) => {
    e.preventDefault();
    moveNoButton();
  });

  function launchConfetti() {
    const emojis = ['💖','💕','🌸','💗','✨','💘','🌷'];
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.animationDelay = (Math.random() * 1.5) + 's';
      el.style.fontSize = (14 + Math.random() * 16) + 'px';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 4000);
    }
  }

  btnSi.addEventListener('click', () => {
    question.style.display = 'none';
    finalMessage.classList.add('show');
    launchConfetti();
    setInterval(launchConfetti, 2000);
  });

  // Corazones cayendo de fondo
  function createFallingHeart() {
    const heart = document.createElement('div');
    heart.className = 'heart';
    heart.textContent = ['💗','💕','💖','🌸','💘'][Math.floor(Math.random()*5)];
    heart.style.left = Math.random() * 100 + 'vw';
    heart.style.animationDuration = (4 + Math.random() * 5) + 's';
    heart.style.fontSize = (16 + Math.random() * 18) + 'px';
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 10000);
  }

  setInterval(createFallingHeart, 400);
</script>

<nav class="project-nav"><a href="../proyectos.html">← Mis proyectos</a><a href="../index.html">Portafolio</a></nav></body>
</html>
